name: SpectraRx external validation
on:
  push:
    branches: [agent/spectrarx-external-validation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Execute complete external validation
        run: python spectrarx_external_validation.py | tee execution.log
      - name: Verify evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          s=json.loads(Path('outputs/STATUS.json').read_text())
          assert s['status']=='completed'
          assert {x['dataset'] for x in s['datasets']}=={'GDSC1','GDSC2','PRISM'}
          q=pd.read_csv('outputs/summary.csv')
          assert len(q)==27
          assert set(q.method)=={'bias','soft_impute','SpectraRx'}
          assert Path('outputs/independent_drug_tests.csv').exists()
          assert Path('outputs/factor_recurrence.json').exists() or s['crossstudy']['status']=='insufficient_overlap'
          print(json.dumps(s,indent=2))
          PY
      - name: Create manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          def h(p):
            x=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(1<<20),b''):x.update(b)
            return x.hexdigest()
          d={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'python':platform.python_version(),'files':{str(p):h(p) for p in sorted(Path('outputs').glob('*')) if p.is_file()}}
          Path('outputs/ARTIFACT_MANIFEST.json').write_text(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spectrarx-external-validation
          path: |
            outputs/
            execution.log
          if-no-files-found: error
          retention-days: 30
