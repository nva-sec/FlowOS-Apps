name: SpectraRx comprehensive gap closure
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spectrarx-external-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy scikit-learn requests
      - name: Execute base data build
        run: python spectrarx_external_validation.py | tee execution.log
      - name: Execute comprehensive gap closure
        run: python spectrarx_gap_closure.py | tee -a execution.log
      - name: Verify evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path('outputs/gap_closure')
          required=['STATUS.json','ablation_summary.csv','ablation_tests.csv','missingness_phase.csv','missingness_explanation.json','hybrid_transfer_summary.csv','hybrid_transfer_per_drug.csv','BAMM_clinical_validation.json','BAMM_patient_scores.csv']
          missing=[x for x in required if not (o/x).exists()]
          assert not missing, missing
          s=json.loads((o/'STATUS.json').read_text());assert s['status']=='completed'
          a=pd.read_csv(o/'ablation_summary.csv')
          assert len(set(a.dataset)&{'GDSC1','GDSC2','PRISM'})==3
          assert len(set(a.method))>=7
          print(json.dumps({'status':s,'files':sorted(x.name for x in o.iterdir()),'methods':sorted(set(a.method))},indent=2))
          PY
      - name: Create manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def h(p):
            x=hashlib.sha256();x.update(p.read_bytes());return x.hexdigest()
          o=Path('outputs/gap_closure');o.mkdir(parents=True,exist_ok=True)
          (o/'MANIFEST.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{p.name:h(p) for p in o.iterdir() if p.is_file()}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectrarx-gap-closure
          path: |
            outputs/gap_closure/
            execution.log
          retention-days: 30
          if-no-files-found: error
