name: Temporary SpectraRx harmonized launcher
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spectrarx-external-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Execute frozen modern-dataset benchmarks
        run: python spectrarx_external_validation.py | tee execution.log
      - name: Execute harmonized GDSC2 to PRISM analysis
        run: python spectrarx_crossstudy_harmonized.py | tee -a execution.log
      - name: Execute factor enrichment and independent-drug transfer inference
        run: python spectrarx_crossstudy_interpretation.py | tee -a execution.log
      - name: Verify complete evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          s=json.loads(Path('outputs/STATUS.json').read_text())
          c=json.loads(Path('outputs/CROSSSTUDY_STATUS.json').read_text())
          i=json.loads(Path('outputs/INTERPRETATION_STATUS.json').read_text())
          assert s['status']=='completed'
          assert {x['dataset'] for x in s['datasets']}=={'GDSC1','GDSC2','PRISM'}
          q=pd.read_csv('outputs/summary.csv')
          assert len(q)==27 and set(q.method)=={'bias','soft_impute','SpectraRx'}
          assert c['status']=='completed', c
          assert c['common_cells']>=30 and c['common_drugs']>=3, c
          assert i['status']=='completed', i
          required=['factor_recurrence_harmonized.json','factor_recurrence_all_loadings.csv','factor_moa_enrichment.csv','crossstudy_transfer_summary.csv','crossstudy_transfer_independent_drug_tests.csv']
          for name in required: assert Path('outputs',name).exists(), name
          print(json.dumps({'benchmark':s,'crossstudy':c,'interpretation':i},indent=2))
          PY
      - name: Create manifest
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          def h(p):
            x=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(1<<20),b''): x.update(b)
            return x.hexdigest()
          d={'analysis_branch_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'python':platform.python_version(),'files':{str(p):h(p) for p in sorted(Path('outputs').glob('*')) if p.is_file()}}
          Path('outputs/ARTIFACT_MANIFEST.json').write_text(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spectrarx-modern-harmonized-validation-final
          path: |
            outputs/
            execution.log
          retention-days: 30
          if-no-files-found: error
